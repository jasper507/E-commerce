name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_ROOT_PASSWORD: ci-root-local-only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: project_one
          MYSQL_USER: project_one
          MYSQL_PASSWORD: project-one-ci-local-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-local-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DJANGO_ENV: test
      DJANGO_SECRET_KEY: django-insecure-ci-only
      MYSQL_DATABASE: project_one
      MYSQL_USER: project_one
      MYSQL_PASSWORD: project-one-ci-local-only
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_TEST_DATABASE: test_project_one

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install MySQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev default-mysql-client pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Grant access to the isolated test database
        env:
          MYSQL_PWD: ci-root-local-only
        run: >-
          mysql --protocol=tcp --host=127.0.0.1 --user=root
          --execute="GRANT ALL PRIVILEGES ON test_project_one.* TO 'project_one'@'%';"

      - name: Check Django configuration and migrations
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py migrate --noinput

      - name: Run tests
        run: python -m pytest
