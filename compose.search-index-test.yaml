name: project-one-search-index-test

services:
  elasticsearch-test:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    environment:
      discovery.type: single-node
      cluster.name: project-one-search-index-test
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    ports:
      - "127.0.0.1:9201:9200"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
