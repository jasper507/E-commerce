name: project-one-ecommerce

services:
  db:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: project_one
      MYSQL_USER: project_one
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-project-one-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-project-one-root-local-only}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.10.1
    profiles: [cache]
    command: [redis-server, --save, "", --appendonly, "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-test:
    image: redis:8.10.1
    profiles: [cache-test]
    command: [redis-server, --save, "", --appendonly, "no"]
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  mysql_data:
